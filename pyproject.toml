[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-continuity"
version = "0.1.0"
description = "Evidence-driven framework for testing whether model transformations preserve declared operational behavior."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "pyarrow>=15.0",
  "psutil>=5.9",
  "PyYAML>=6.0",
  "scipy>=1.12",
  "torch>=2.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
sentence-transformers = ["sentence-transformers>=2.6"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1"]
dev = ["ruff>=0.6", "black>=24.0", "mypy>=1.10"]

[project.scripts]
neural-continuity = "neural_continuity.cli:main"
neural-continuity-materialize = "neural_continuity.dataset_materialization:main"
neural-continuity-m1-teacher-evidence = "neural_continuity.m1_teacher_evidence:main"
neural-continuity-m1-measurement-null = "neural_continuity.m1_measurement_null:main"
neural-continuity-m1-transition-a = "neural_continuity.m1_onnx_transition:main"
neural-continuity-m1-onnx-null = "neural_continuity.m1_b.onnx_null:main"
neural-continuity-m1-calibration = "neural_continuity.m1_b.calibration_data:main"
neural-continuity-m1-static-quantization = "neural_continuity.m1_b.static_quantization:main"
neural-continuity-m1-int8-observation = "neural_continuity.m1_b.onnx_int8_observation:main"
neural-continuity-m1-fp32-observation = "neural_continuity.m1_b.onnx_fp32_observation:main"
neural-continuity-m1-observation-compatibility = "neural_continuity.m1_b.paired_observation_compatibility:main"
neural-continuity-m1-pure-comparison = "neural_continuity.m1_b.pure_comparison:main"
neural-continuity-m1-transition-b-decision = "neural_continuity.m1_b.decision_package:main"
neural-continuity-m1-diagnostic-preflight = "neural_continuity.m1_diagnostics.preflight:main"
neural-continuity-m1-diagnostic-instrumentation = "neural_continuity.m1_diagnostics.instrumentation_preflight:main"
neural-continuity-m1-diagnostic-fidelity = "neural_continuity.m1_diagnostics.fidelity_cli:main"
neural-continuity-m1-diagnostic-activation = "neural_continuity.m1_diagnostics.activation_cli:main"
neural-continuity-m1-diagnostic-analysis = "neural_continuity.m1_diagnostics.activation_analysis_cli:main"
neural-continuity-m1-diagnostic-clusters = "neural_continuity.m1_diagnostics.structural_cluster_cli:main"
neural-continuity-m1-diagnostic-causal-plan = "neural_continuity.m1_diagnostics.causal_plan_cli:main"
neural-continuity-m1-diagnostic-stage0 = "neural_continuity.m1_diagnostics.stage0_cli:main"
neural-continuity-m1-runtime-provenance = "neural_continuity.m1_diagnostics.runtime_provenance_cli:main"
neural-continuity-m1-null-extension-plan = "neural_continuity.m1_diagnostics.measurement_null_extension_cli:main"
neural-continuity-m1-null-sentinel = "neural_continuity.m1_diagnostics.measurement_null_sentinel_cli:main"

[project.urls]
Repository = "https://github.com/Daniele-Cangi/Neural-Continuity"
Issues = "https://github.com/Daniele-Cangi/Neural-Continuity/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
pythonpath = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
  "torch",
  "torch.*",
  "onnx",
  "onnxruntime",
  "onnxruntime.*",
  "pandas",
  "psutil",
  "yaml",
  "scipy",
  "scipy.*"
]
ignore_missing_imports = true
