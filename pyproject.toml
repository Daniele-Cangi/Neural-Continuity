[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-continuity"
version = "0.1.0"
description = "M0 measurement integrity for model continuity experiments."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "pyarrow>=15.0",
  "psutil>=5.9",
  "PyYAML>=6.0",
  "scipy>=1.12",
  "torch>=2.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
sentence-transformers = ["sentence-transformers>=2.6"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1"]
dev = ["ruff>=0.6", "black>=24.0", "mypy>=1.10"]

[project.scripts]
neural-continuity = "neural_continuity.cli:main"
neural-continuity-materialize = "neural_continuity.dataset_materialization:main"
neural-continuity-m1-teacher-evidence = "neural_continuity.m1_teacher_evidence:main"
neural-continuity-m1-measurement-null = "neural_continuity.m1_measurement_null:main"
neural-continuity-m1-transition-a = "neural_continuity.m1_onnx_transition:main"

[project.urls]
Homepage = "https://example.com/neural-continuity"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
pythonpath = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
  "torch",
  "torch.*",
  "onnx",
  "onnxruntime",
  "pandas",
  "psutil",
  "yaml",
  "scipy",
  "scipy.*"
]
ignore_missing_imports = true
