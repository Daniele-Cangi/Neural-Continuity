name: Offline validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install repository and validation dependencies
        run: python -m pip install -e ".[test,dev,onnx,sentence-transformers]"
      - name: Pytest
        run: python -m pytest -q
      - name: Ruff
        run: ruff check .
      - name: Black
        run: python -m black --check --workers 1 -- src tests
      - name: Mypy
        run: python -m mypy src
      - name: Compileall
        run: python -m compileall -q src tests
